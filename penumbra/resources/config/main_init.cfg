<!-- Penumbra product: startup settings read before the engine starts. -->
<MainInit>
  <Window Caption="Penumbra" />
  <!-- Under the personal directory (~/.frictionalgames/ on Linux, Documents on
       Windows). The mesh cache is kept here so nothing is written to the install. -->
  <Directories UserFolder="Penumbra Redux" LogFile="penumbra.log" MeshCache="cache/meshes" />
  <!-- UserSettings is in the user folder; DefaultSettings is used until it exists. -->
  <ConfigFiles DefaultSettings="config/default_main_settings.cfg" UserSettings="main_settings.cfg" />
  <Gui DefaultSkin="penumbra_default.skin" />
</MainInit>
