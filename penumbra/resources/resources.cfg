<!-- Penumbra product: this product's own resource directories, relative to the
     executable. The install's directories (its own resources.cfg) are added at
     priority 20 and shadow these; the engine's (core/*, compiled_shaders/*) are
     at priority 0. core/textures holds this product's core_dissolve.tga and
     colorgrading_base.png: the engine adds it, and needs them, while it starts. -->
<Resources>
  <Directory Path="/fonts" Priority="10" />
  <Directory Path="/gui" Priority="10" />
</Resources>
