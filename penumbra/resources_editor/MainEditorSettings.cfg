<!-- Penumbra product: the level editor's settings, staged next to the editor
     (premake/tools.lua). Each category is a top-level element (cConfigFile).
     The editor's object folders are relative to the Penumbra install, which it
     reads and never writes; its own files (maps, thumbnails, mesh caches, log)
     go to the user directory, "Penumbra Redux" under Documents
     (~/.frictionalgames/ on Linux), like the game's.
     PenumbraInstall: the install to use; empty means Overture in a Steam library. -->
<Directories PenumbraInstall=""
             EditorHomeDir="Penumbra Redux/Editor" GameHomeDir="Penumbra Redux/"
             StaticObjectsDir="models" EntitiesDir="models" DecalsDir="textures/decals"
             LightsDir="lights" BillboardsDir="billboards" ParticlesDir="particles" SoundsDir="sounds" />
<Gui Skin="penumbra_default.skin" />
