name: Build

on:
  pull_request:
  push:
    branches:
      - main

# A full cold build of the engine + SDL2 + openal-soft is expensive; don't let
# superseded pushes on the same ref pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --product=penumbra adds this fork's Penumbra product to the same build as
  # TDD and AMFP; their projects are generated exactly as without it.
  linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      config: release
      premake_args: --product=penumbra

  windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      config: release
      premake_args: --product=penumbra
